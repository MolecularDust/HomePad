<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="squircle-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0E1B3D" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#0B132B" flood-opacity="0.08" />
    </filter>
    <linearGradient id="blue-base" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2DAAF3" />
      <stop offset="5%" stop-color="#1991EB" />
      <stop offset="45%" stop-color="#0056E0" />
      <stop offset="100%" stop-color="#0035B8" />
    </linearGradient>
    <linearGradient id="inner-edge-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="face-volume" cx="45%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="75%" stop-color="#000000" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45" />
    </radialGradient>
    <linearGradient id="bottom-recession" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="85%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.32" />
    </linearGradient>
  </defs>

  <!-- Beveled Cobalt Squircle Background -->
  <g id="Beveled-Background">
    <rect x="44" y="44" width="424" height="424" rx="108" fill="#021C51" filter="url(#squircle-shadow)" />
    <rect x="44" y="44" width="424" height="424" rx="108" fill="url(#blue-base)" />
    <rect x="44" y="44" width="424" height="424" rx="108" fill="url(#face-volume)" />
    <rect x="44" y="44" width="424" height="424" rx="108" fill="url(#bottom-recession)" />
    <rect x="45.5" y="45.5" width="421" height="421" rx="106.5" stroke="url(#inner-edge-highlight)" stroke-width="3" fill="none" />
    <rect x="44" y="44" width="424" height="424" rx="108" stroke="#041E4E" stroke-width="1.5" fill="none" opacity="0.3" />
  </g>

  <!-- Pure Flat White 3x3 Grid -->
  <g id="Flat-White-Grid" fill="#FFFFFF">
    <!-- Row 1 -->
    <rect x="120" y="120" width="74" height="74" rx="19" />
    <rect x="219" y="120" width="74" height="74" rx="19" />
    <rect x="318" y="120" width="74" height="74" rx="19" />
    <!-- Row 2 -->
    <rect x="120" y="219" width="74" height="74" rx="19" />
    <rect x="219" y="219" width="74" height="74" rx="19" />
    <rect x="318" y="219" width="74" height="74" rx="19" />
    <!-- Row 3 -->
    <rect x="120" y="318" width="74" height="74" rx="19" />
    <rect x="219" y="318" width="74" height="74" rx="19" />
    <rect x="318" y="318" width="74" height="74" rx="19" />
  </g>
</svg>